AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: API Serverless completa con Lambda + API Gateway + DynamoDB

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.13
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref ItemsTable
    LoggingConfig:
      LogFormat: JSON

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: Nombre del entorno

Resources:
  # ------------------------------
  # 1. TABLA DYNAMODB
  # ------------------------------
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-items-table
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ------------------------------
  # 2. FUNCIÓN LAMBDA
  # ------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-api-handler
      CodeUri: lambda_function/
      Handler: lambda_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
      Events:
        CreateItem:
          Type: HttpApi
          Properties:
            Path: /items
            Method: POST
            ApiId: !Ref ServerlessApi
        GetItem:
          Type: HttpApi
          Properties:
            Path: /items/{id}
            Method: GET
            ApiId: !Ref ServerlessApi
        ListItems:
          Type: HttpApi
          Properties:
            Path: /items
            Method: GET
            ApiId: !Ref ServerlessApi

  # ------------------------------
  # 3. API GATEWAY (HTTP API - más barata y rápida)
  # ------------------------------
  ServerlessApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300
      Tags:
        Environment: !Ref EnvironmentName

  # ------------------------------
  # 4. ROL IAM CON MÍNIMOS PRIVILEGIOS
  # ------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt ItemsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:ListTables
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
  myKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: <String>

Outputs:
  ApiEndpoint:
    Description: URL del endpoint de la API
    Value: !Sub https://${ServerlessApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/
  ApiFunctionName:
    Description: Nombre de la función Lambda
    Value: !Ref ApiFunction
  DynamoDBTableName:
    Description: Tabla DynamoDB
    Value: !Ref ItemsTable